name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Lint, test, and build
    runs-on: ubuntu-latest

    environment:
      name: preview
      url: https://qa.simplefactu.com

    env:
      # Real Clerk test keys from repo secrets (pk_test_ci_placeholder fails next build prerender).
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci?sslmode=require
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY_PREVIEW }}
      CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY_PREVIEW }}
      NEXT_PUBLIC_CLERK_SIGN_IN_URL: /sign-in
      NEXT_PUBLIC_CLERK_SIGN_UP_URL: /sign-up
      NEXT_PUBLIC_CLERK_AFTER_SIGN_IN_URL: /invoices
      NEXT_PUBLIC_CLERK_AFTER_SIGN_UP_URL: /invoices
      SIMPLEFACTU_API_BASE_URL: http://127.0.0.1:3000/v1
      SIMPLEFACTU_ADMIN_KEY: ci-admin-key
      VERIFACTU_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
      VERIFACTU_SI_NIF: B12345678
      VERIFACTU_SI_NOMBRE_RAZON: CI Test SL
      VERIFACTU_SI_ID: "01"
      VERIFACTU_SI_VERSION: "1.0.0"
      VERIFACTU_SI_SOLO_VERI: S
      VERIFACTU_SI_MULTI_OT: "N"
      VERIFACTU_SI_IND_MULTI_OT: "N"
      CI: "true"
      DOCKER_BUILD: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint, typecheck, and unit tests
        run: pnpm run check

      - name: Production build
        run: pnpm exec next build
